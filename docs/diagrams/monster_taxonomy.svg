="370" text-anchor="middle" font-size="22" font-weight="700">Combat Role</text><text x="600" y="408" text-anchor="middle" font-size="15">Pressure · Ranged · Ambush · Defense</text><text x="600" y="432" text-anchor="middle" font-size="15">Support · Summon · Swarm · Control · Flee</text><rect x="820" y="330" width="300" height="120" rx="18" fill="#f3f3f3" stroke="#555"/><text x="970" y="370" text-anchor="middle" font-size="22" font-weight="700">Behavior Motivation</text><text x="970" y="402" text-anchor="middle" font-size="15">Territory · Hunt · Food · Mission · Protect</text><text x="970" y="426" text-anchor="middle" font-size="15">Religion · Observe · Capture · Eliminate · Pleasure</text><rect x="390" y="510" width="420" height="78" rx="18" fill="#f8f8f8" stroke="#333" stroke-width="2"/><text x="600" y="545" text-anchor="middle" font-size="21" font-weight="700">Actor Definition</text><text x="600" y="572" text-anchor="middle" font-size="15">taxonomy + body template + stats + AI policy + traits</text></g></svg>