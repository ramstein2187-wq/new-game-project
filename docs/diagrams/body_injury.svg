<svg xmlns="http://www.w3.org/2000/svg" width="760" height="868" viewBox="0 0 760 868">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="380" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">신체 부위와 기능 효율</text>
