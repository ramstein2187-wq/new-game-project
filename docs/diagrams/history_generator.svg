<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">History architecture v1 and generation algorithm v2</title>
  <desc id="desc">Fixed Canon constrains recent seeded history. Objective effects project the present. Separate perceived claims cannot alter objective truth. Validator checks references, policy, replay and surviving scars. Gameplay simulation is deferred.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#53637b"/></marker></defs>
  <rect width="1080" height="560" fill="#f6f8fc"/>
  <g font-family="sans-serif" fill="#192e48" text-anchor="middle">
    <text x="540" y="35" font-size="24" font-weight="bold">History architecture v1 / generation algorithm v2</text>
    <g fill="white" stroke="#7185a3" stroke-width="2">
      <rect x="40" y="65" width="440" height="68" rx="10"/>
      <rect x="600" y="65" width="440" height="68" rx="10"/>
      <rect x="280" y="177" width="520" height="68" rx="10" fill="#e2f0ff"/>
      <rect x="40" y="303" width="440" height="82" rx="10"/>
      <rect x="600" y="303" width="440" height="82" rx="10" fill="#fff5df"/>
      <rect x="280" y="446" width="520" height="72" rx="10"/>
    </g>
    <g font-size="18">
      <text x="260" y="92">CanonPolicy</text><text x="260" y="117" font-size="14">LOCKED / RESERVED / generation permissions</text>
      <text x="820" y="92">SeedDeriver + local RNG</text><text x="820" y="117" font-size="14">independent axes / dates / relations / beliefs / names</text>
      <text x="540" y="204">Generated Objective History</text><text x="540" y="229" font-size="14">precursor → pressure chain → collapse → successors → recent events</text>
      <text x="260" y="334">HistoryProjector → Present State</text><text x="260" y="362" font-size="14">factions / ancestry / relations / sites / discoveries / system traces</text>
      <text x="820" y="334">Separate Perceived History</text><text x="820" y="362" font-size="14">contextual faction claims + scholarly terminology knowledge gate</text>
      <text x="540" y="473">HistoryValidator → HistoryResult / CLI</text><text x="540" y="501" font-size="14">policy / lifecycle / replay / scars / local systems / knowledge</text>
      <text x="540" y="547" font-size="14">Playable-map integration and post-start simulation are future work.</text>
    </g>
    <g fill="none" stroke="#53637b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M260 133 L260 160 L400 160 L400 177"/>
      <path d="M820 133 L820 160 L680 160 L680 177"/>
      <path d="M400 245 L400 272 L260 272 L260 303"/>
      <path d="M680 245 L680 272 L820 272 L820 303"/>
      <path d="M260 385 L260 413 L400 413 L400 446"/>
      <path d="M820 385 L820 413 L680 413 L680 446"/>
    </g>
  </g>
</svg>
